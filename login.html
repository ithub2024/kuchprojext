<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Login Page</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
      overflow:hidden;
    }

    /* Background Glow */
    body::before,
    body::after{
      content:'';
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      filter:blur(100px);
      z-index:0;
    }

    body::before{
      background:#38bdf8;
      top:-50px;
      left:-50px;
    }

    body::after{
      background:#9333ea;
      bottom:-50px;
      right:-50px;
    }

    .login-container{
      position:relative;
      z-index:1;
      width:380px;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.2);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      color:white;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-10px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      font-size:32px;
      font-weight:600;
      letter-spacing:1px;
    }

    .input-box{
      position:relative;
      margin-bottom:25px;
    }

    .input-box input{
      width:100%;
      padding:14px 15px;
      border:none;
      outline:none;
      border-radius:12px;
      background:rgba(255,255,255,0.15);
      color:white;
      font-size:15px;
      transition:0.3s;
    }

    .input-box input::placeholder{
      color:#ddd;
    }

    .input-box input:focus{
      background:rgba(255,255,255,0.25);
      box-shadow:0 0 10px #38bdf8;
    }

    .remember-forgot{
      display:flex;
      justify-content:space-between;
      font-size:14px;
      margin-bottom:20px;
    }

    .remember-forgot a{
      color:#fff;
      text-decoration:none;
      transition:0.3s;
    }

    .remember-forgot a:hover{
      color:#38bdf8;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#06b6d4,#3b82f6);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      transform:scale(1.03);
      box-shadow:0 0 15px #38bdf8;
    }

    .register-link{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .register-link a{
      color:#38bdf8;
      text-decoration:none;
      font-weight:500;
    }

    .register-link a:hover{
      text-decoration:underline;
    }

  </style>
</head>

<body>

    <h1>Login Page </h1>

  <div class="login-container">
    <h2>Welcome Back</h2>

    <form>
      <div class="input-box">
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Enter your password" required>
      </div>

      <div class="remember-forgot">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="register-link">
        Don't have an account?
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
